[package]
name = "asr-onnx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
ndarray = "0.16.1"
ort = { git = "https://github.com/pykeio/ort.git", features = [
    "tensorrt",
    "cuda",
] }
tracing-subscriber = { version = "0.3.19", features = [
    "env-filter",
    "fmt",
    "time",
] }
crossbeam-channel = "0.5.15"
tracing = "0.1.41"
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.10.1"
edit-distance = "2.1.3"
ndarray-npy = "0.9.1"
